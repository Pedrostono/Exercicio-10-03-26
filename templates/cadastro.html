<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastrostyle.css') }}">
</head>

<body>

    <h1>Crie sua conta</h1>

    <form method="POST">
        <ul>
            <li>
                <label>Nome completo</label>
                <input type="text" name="nomeinp" placeholder="Seu nome completo" required>
            </li>

            <li>
                <label>Telefone</label>
                <input type="text" name="telinp" placeholder="(00) 00000-0000" required>
            </li>

            <li>
                <label>CPF</label>
                <input type="text" name="cpfinp" placeholder="000.000.000-00" required>
            </li>

            <li>
                <label>Email</label>
                <input type="text" name="emailinp" placeholder="seu@email.com" required>
            </li>

            <li>
                <label>Senha</label>
                <input type="password" name="senhainp" placeholder="Digite sua senha" required>
            </li>

            <li>
                <label>Status</label>
                <select name="status" required>
                    <option value="">Selecione</option>
                    <option value="1">Ativo</option>
                    <option value="0">Inativo</option>
                </select>
            </li>

            <li>
                <label>Cargo</label>
                <input type="text" name="cargoinp" placeholder="Seu cargo" required>
            </li>
        </ul>

        <input type="submit" value="Cadastrar">
    </form>

    <p>Já tem uma conta?</p>
    <a href="/">Fazer login</a>

</body>
</html>
