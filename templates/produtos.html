<!doctype html>
<html>
  <head>
    <title>Produtos</title>
  </head>
  <body>
    <h1>Lista de Produtos</h1>

    <form method="GET">
      <input type="text" name="filtro" placeholder="Buscar produto..." />
      <button type="submit">Filtrar</button>
    </form>

    <br />

    <table border="1">
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Preço</th>
        <th>Estoque</th>
        <th>Ação</th>
      </tr>

      {% for produto in produtos %}
      <tr>
        <td>{{ produto.id }}</td>
        <td>{{ produto.nome }}</td>
        <td>{{ produto.descricao }}</td>
        <td>{{ produto.preco }}</td>
        <td>{{ produto.estoque }}</td>
        <td>
          <a href="/deletar/{{ produto[0] }}">
            <button>Deletar</button>
          </a>
        </td>
      </tr>
      {% endfor %}
    </table>

    <br />
    <a href="/home">Voltar</a>
  </body>
</html>
