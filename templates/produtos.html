<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/produtosstyle.css') }}">
  </head>
  <body>

    <h1>Lista de Produtos</h1>

    <form method="GET">
      <input type="text" name="filtro" placeholder="Buscar produto..." value="{{ request.args.get('filtro', '') }}">
      <button type="submit">Filtrar</button>
    </form>

    <table>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Preço</th>
        <th>Estoque</th>
        <th>Ação</th>
      </tr>

      {% for produto in produtos %}
      <tr>
        <td>{{ produto.id }}</td>
        <td>{{ produto.nome }}</td>
        <td>{{ produto.descricao }}</td>
        <td>R$ {{ produto.preco }}</td>
        <td>{{ produto.estoque }}</td>
        <td>
          <form action="/deletar/{{ produto.id }}" method="GET">
            <button type="submit">Deletar</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>

    <a href="/home">Voltar</a>

  </body>
</html>
