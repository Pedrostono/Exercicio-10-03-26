<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Usuário</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/menuusuariosstyle.css') }}">
</head>

<body>

  <div class="container">
    <div class="card">
      <div class="saudacao">
      <h2>Olá, {{ usuario.nome }}</h2>
      </div>
      <h2>Seu Perfil</h2>

      <div class="info"><span class="label">ID:</span> {{ usuario.id }}</div>
      <div class="info"><span class="label">Nome:</span> {{ usuario.nome }}</div>
      <div class="info"><span class="label">CPF:</span> {{ usuario.cpf }}</div>
      <div class="info"><span class="label">Email:</span> {{ usuario.email }}</div>
      <div class="info"><span class="label">Telefone:</span> {{ usuario.tel }}</div>
      <div class="info"><span class="label">Status:</span> {{ usuario.status }}</div>
      <div class="info"><span class="label">Cargo:</span> {{ usuario.cargo }}</div>

      <a href="/listausers">
        <button class="btn">Lista de Usuários</button>
      </a>

      <a href="/relatorio">
        <button class="btn">Relatório de acessos</button>
      </a>

      <a href="/home">
        <button class="btn">Voltar</button>
      </a>
    </div>
  </div>

</body>
</html>
